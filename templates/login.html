{% extends "base.html" %}

{% block title %}Login - Skin Disease Detection{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">🔐 Login</h2>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div>
                <label for="email">📧 Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="password">🔑 Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>

        <hr style="margin: 2rem 0;">

        <div style="text-align: center;">
            <p>Don't have an account? <a href="{{ url_for('register') }}" style="color: #3498db;">Register here</a></p>
        </div>

        <div style="margin-top: 2rem; padding: 1rem; background: #ecf0f1; border-radius: 5px;">
            <h4 style="margin-bottom: 1rem;">📝 Demo Credentials:</h4>
            <p><strong>Email:</strong> demo@patient.com</p>
            <p><strong>Password:</strong> demo123</p>
        </div>
    </div>
</div>
{% endblock %}
